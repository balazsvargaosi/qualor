<q-auth-layout>
  <div class="card auth-card">
    <h1 i18n="@@auth.reset.title">Choose a new password</h1>
    @if (invalid()) {
      <p
        #invalidNote
        class="alert alert-error"
        role="alert"
        data-test="token-invalid"
        tabindex="-1"
        i18n="@@auth.reset.invalid"
      >
        This link has expired or was already used. Ask for a new one.
      </p>
      <p class="auth-alt">
        <a routerLink="/forgot-password" i18n="@@auth.reset.askNew">Ask for a new link</a>
      </p>
    } @else {
      <form method="post" (submit)="submit($event)">
        @if (error(); as message) {
          <p class="alert alert-error" role="alert">{{ message }}</p>
        }
        <div class="field">
          <label for="reset-new" i18n="@@auth.reset.new">New password</label>
          <input
            id="reset-new"
            type="password"
            autocomplete="new-password"
            required
            [attr.minlength]="minLength"
            [attr.maxlength]="maxLength"
            aria-describedby="reset-new-hint"
            [attr.aria-invalid]="nextError() ? true : null"
            [value]="next()"
            (input)="next.set(inputValue($event))"
          />
          <span id="reset-new-hint" class="hint" i18n="@@auth.reset.hint"
            >At least {{ minLength }} characters.</span
          >
          @if (nextError(); as message) {
            <span class="field-error" role="alert">{{ message }}</span>
          }
        </div>
        <div class="field">
          <label for="reset-confirm" i18n="@@auth.reset.confirm">Repeat the new password</label>
          <input
            id="reset-confirm"
            type="password"
            autocomplete="new-password"
            required
            [attr.maxlength]="maxLength"
            [value]="confirm()"
            (input)="confirm.set(inputValue($event))"
          />
        </div>
        <button
          type="submit"
          class="btn btn-primary"
          [attr.aria-disabled]="busy() ? true : null"
          i18n="@@auth.reset.submit"
        >
          Set the new password
        </button>
      </form>
      <p class="auth-alt">
        <a routerLink="/login" i18n="@@auth.reset.back">Back to sign-in</a>
      </p>
    }
  </div>
</q-auth-layout>
